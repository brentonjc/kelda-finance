# Static site — no build step. Declare explicitly so the deploy never depends
# on (or is broken by) build settings configured in the Netlify UI.
[build]
  publish = "."
  command = "echo 'Static site — nothing to build'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN, not DENY: the app embeds kelda-investment-property.html in a
    # same-origin iframe (Beta Features → Investment Property). DENY blocks that too.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# pdf.js ships as ES modules (.mjs). Module scripts need a JavaScript type, and the
# site sends nosniff, so don't rely on Netlify's default for the extension.
[[headers]]
  for = "/assets/vendor/pdfjs/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
