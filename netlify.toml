# Static site — no build step. Declare explicitly so the deploy never depends
# on (or is broken by) build settings configured in the Netlify UI.
[build]
  publish = "."
  command = "echo 'Static site — nothing to build'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
